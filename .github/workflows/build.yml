name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check DNS usage classification
        run: |
          swiftc DNSSecurityProMac/Services/DNSUsageDiagnostic.swift Tests/main.swift -o "$RUNNER_TEMP/dns-usage-check"
          "$RUNNER_TEMP/dns-usage-check"

      - name: Build
        run: |
          xcodebuild \
            -project DNSSecurityProMac.xcodeproj \
            -scheme "DNS Security Pro macOS" \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
